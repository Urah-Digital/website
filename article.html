<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: { base: '#0F0F0F', surface: '#18181B', border: '#27272A' },
                        brass: { DEFAULT: '#C8A962', light: '#D8BE7E' }
                    },
                    fontFamily: {

                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace']

                }
            }
        };

    <style>
        a:focus-visible { outline: 2px solid #D8BE7E; outline-offset: 4px; }
        ::selection { background: #C8A962; color: #0F0F0F; }

            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }

    <script src="site-content.js" defer></script>

<body class="bg-obsidian-base font-sans text-zinc-300 antialiased">

                <span class="font-serif text-sm font-bold tracking-widest text-white sm:text-base">URAH DIGITAL</span>
            </a>
            <nav aria-label="Main navigation" class="flex items-center gap-2 font-mono text-[9px] uppercase tracking-wider text-zinc-400 sm:gap-6 sm:text-xs">

                <a href="blog.html" class="transition-colors hover:text-white">Insights</a>

                <a href="blog.html" class="hover:text-white">Insights</a>
            </nav>
            <article id="article-content" class="mx-auto max-w-[70ch]" role="status" aria-live="polite">

            </article>
            <nav aria-label="Article navigation" class="mx-auto mt-14 max-w-[70ch] border-t border-obsidian-border pt-6">

    <footer class="mt-14 border-t border-obsidian-border py-10">

                <a href="index.html#contact" class="hover:text-zinc-300">Contact</a>
                <a href="mailto:info@urah.com.ng" class="hover:text-zinc-300">info@urah.com.ng</a>

</html>
